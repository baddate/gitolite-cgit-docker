services:
  gitolite:
    image: ghcr.io/baddate/gitolite-cgit-docker-gitolite:latest
    container_name: gitolite
    restart: unless-stopped

    # no-new-privileges:true is intentionally omitted here.
    # sshd requires root at startup to bind port 22 and manage its internal
    # privilege-separation children (ssh-privsep).  Setting no-new-privileges
    # would break sshd's privsep model.  All actual git operations run as the
    # unprivileged git user (UID 1000) via gitolite's ForceCommand — root is
    # never involved in repository access.
    # If you replace sshd with a port >= 1024 and a non-root listener, you
    # can then safely add:
    #   security_opt:
    #     - no-new-privileges:true

    ports:
      - "2222:22" # SSH access

    volumes:
      - git-data:/var/lib/git # gitolite home
      - ssh-data:/etc/ssh # persistent host keys

    networks:
      - git-net

  cgit:
    image: ghcr.io/baddate/gitolite-cgit-docker-cgit:latest
    container_name: cgit
    restart: unless-stopped

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
      - /var/lib/nginx/logs

    ports:
      - "8080:80" # Web UI

    volumes:
      - git-data:/var/lib/git:ro # read-only mount

    depends_on:
      gitolite:
        condition: service_healthy

    networks:
      - git-net

volumes:
  git-data:
  ssh-data:

networks:
  git-net:
    driver: bridge
