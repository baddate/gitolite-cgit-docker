services:
  app:
    image: rusian/gitolite-cgit
    container_name: gitolite-cgit
    env_file: config.env
    restart: unless-stopped
    volumes:
      - ssh:/etc/ssh
      - git:/var/lib/git
    ports:
      - 22:22
      - 80:80
      - 9418:9418
    security_opt:
      - no-new-privileges:false # su-exec need to switch user
    cap_drop:
      - ALL
    cap_add:
      - CAP_NET_BIND_SERVICE # nginx bind 80
      - CAP_CHOWN # entrypoint chown
      - CAP_SETGID # su-exec
      - CAP_SETUID # su-exec
      - CAP_FOWNER # chmod
      - CAP_DAC_OVERRIDE # sshd read host key
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/cache/cgit
      - /var/log/nginx
      - /var/lib/nginx
      - /etc/nginx/http.d
volumes:
  ssh:
  git:
