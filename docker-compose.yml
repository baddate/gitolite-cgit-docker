services:
  app:
    image: ghcr.io/baddate/gitolite-cgit-docker
    container_name: gitolite-cgit
    env_file: config.env
    mem_limit: 512m
    restart: always
    volumes:
      - git:/etc/ssh
      - git:/var/lib/git
      # where to put webui files
      - cgit:/usr/share/webapps/cgit
      - ./cgitrc:/etc/cgitrc
      - ./about.md:/var/www/htdocs/about.md
    ports:
      - 22:22
      - 8771:80
      - 9418:9418

volumes:
  git:
  cgit:
