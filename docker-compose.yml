services:
  app:
    image: rusian/gitolite-cgit
    container_name: gitolite-cgit
    env_file: config.env
    restart: unless-stopped
    volumes:
      - ssh:/etc/ssh
      - git:/var/lib/git
    ports:
      - 22:22
      - 80:80
      - 9418:9418
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CAP_NET_BIND_SERVICE  # nginx binds port 80
      - CAP_CHOWN             # gitolite repo operations
      - CAP_SETGID            # gitolite user management
      - CAP_SETUID            # gitolite user management
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /var/cache/cgit
      - /var/log/nginx
volumes:
  ssh:
  git:
