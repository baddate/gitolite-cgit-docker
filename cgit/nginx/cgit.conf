server {
    listen 80 default_server;
    server_name localhost;

    # Use tmpfs-backed paths so nginx works under read-only rootfs
    client_body_temp_path /tmp/nginx/client_body 1 2;
    fastcgi_temp_path     /tmp/nginx/fastcgi     1 2;
    proxy_temp_path       /tmp/nginx/proxy        1 2;
    uwsgi_temp_path       /tmp/nginx/uwsgi        1 2;
    scgi_temp_path        /tmp/nginx/scgi         1 2;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;


    root /var/www/htdocs/cgit;

    # Serve static assets directly — must come before the catch-all.
    # cgit's HTML references these by fixed path (no cache-busting hash), so
    # keep css/js at a modest TTL to still pick up theme/asset updates; icons
    # and robots.txt change rarely and can cache longer.
    location = /cgit.css    { expires 1d; add_header Cache-Control "public"; try_files $uri =404; }
    location = /cgit.js     { expires 1d; add_header Cache-Control "public"; try_files $uri =404; }
    location = /cgit.png    { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
    location = /favicon.ico { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
    location = /robots.txt  { expires 7d; add_header Cache-Control "public"; try_files $uri =404; }

    # Dynamic CGI
    location / {
        try_files $uri @cgit;
    }

    location @cgit {
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root/cgit.cgi;
        fastcgi_param PATH_INFO       $uri;
        fastcgi_param QUERY_STRING    $args;
        fastcgi_param QUERY_INFO      $uri;
        fastcgi_param HTTP_HOST       $server_name;
        fastcgi_param REQUEST_METHOD  $request_method;
        fastcgi_param CONTENT_TYPE    $content_type;
        fastcgi_param CONTENT_LENGTH  $content_length;

        fastcgi_pass unix:/run/fcgiwrap/fcgiwrap.socket;
    }

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1000;
    gzip_buffers    16 8k;
    gzip_comp_level 2;
    gzip_types
        text/css
        application/javascript
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # Timeouts & sendfile
    client_body_timeout       30s;
    client_header_timeout     10s;
    send_timeout              10s;
    keepalive_timeout         10s;
    reset_timedout_connection on;
    proxy_ignore_client_abort on;

    tcp_nopush        on;
    tcp_nodelay       on;
    sendfile          on;
    sendfile_max_chunk 1M;
    aio               threads;
}