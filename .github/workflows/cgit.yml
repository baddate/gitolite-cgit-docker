name: cgit

on:
  workflow_dispatch:
  push:
    paths:
      - "cgit/**"
      - ".github/workflows/cgit.yml"

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}-cgit

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false # do not cancel other arch builds if one fails
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=cgit
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      # ─────────────────────────────────────────────
      # Build and push image by digest (per-arch)
      # ─────────────────────────────────────────────
      - name: Build & Push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./cgit
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true
          labels: ${{ steps.meta.outputs.labels }}

          # Use per-arch cache to avoid cross-arch pollution
          cache-from: type=gha,scope=cgit-${{ matrix.platform }}
          cache-to: type=gha,scope=cgit-${{ matrix.platform }},mode=max

      # ─────────────────────────────────────────────
      # Export digest as artifact (required for merge)
      # ─────────────────────────────────────────────
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          echo "Digest: $digest"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # ─────────────────────────────────────────────
      # Security scan (run only once on amd64)
      # ─────────────────────────────────────────────
      - name: Trivy scan (amd64 only)
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ==========================================================
  # Merge multi-arch manifest
  # ==========================================================
  merge:
    name: Merge multi-arch manifest (cgit)
    runs-on: ubuntu-latest
    needs: build

    permissions:
      packages: write
      id-token: write

    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute final tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=cgit
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      # ─────────────────────────────────────────────
      # Create and push multi-arch manifest
      # ─────────────────────────────────────────────
      - name: Create manifest
        working-directory: /tmp/digests
        run: |
          echo "Available digests:"
          ls -l

          # Construct image sources from digests
          SOURCES=$(printf '${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s ' *)

          # Generate tag arguments
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}')

          echo "Sources: $SOURCES"
          echo "Tags: $TAGS"

          docker buildx imagetools create \
            $TAGS \
            $SOURCES

      # ─────────────────────────────────────────────
      # Verify manifest
      # ─────────────────────────────────────────────
      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
