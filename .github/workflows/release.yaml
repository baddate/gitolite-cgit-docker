name: release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: cgit branch or tag
        required: false
        default: "1.3"
      url:
        description: cgit repo url
        required: false
        default: https://git.zx2c4.com/cgit
      version:
        description: git version (must match Alpine package)
        required: false
        default: "2.52.0"
  schedule:
    - cron: "0 0 * * 5"
  push:
    branches:
      - master
      - dev
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  # Dispatch overrides → fallback to defaults that match the Dockerfile
  CGIT_VER: ${{ inputs.branch || '1.3' }}
  CGIT_URL: ${{ inputs.url || 'https://git.zx2c4.com/cgit' }}
  GIT_VER: ${{ inputs.version || '2.52.0' }}

jobs:
  build-push:
    name: Build, scan & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      security-events: write # upload SARIF

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Meta ────────────────────────────────────────────────────────────────
      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            # semver tag  →  v1.2.3 / v1.2 / v1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # branch push  →  master / dev
            type=ref,event=branch
            # short SHA    →  always present
            type=sha,prefix=,format=short
            # cgit version →  cgit-1.3
            type=raw,value=cgit-${{ env.CGIT_VER }}
            # latest only on master / tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}

      # ── Build infra ─────────────────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build (load locally for scan) ───────────────────────────────────────
      # Build once, export to local Docker daemon for Trivy, then push the
      # cached layers — avoids building twice.
      - name: Build image (amd64, load for scan)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: gitolite-cgit
          file: gitolite-cgit/Dockerfile
          platforms: linux/amd64
          build-args: |
            CGIT_VER=cgit-${{ env.CGIT_VER }}
            CGIT_URL=${{ env.CGIT_URL }}/snapshot
            GIT_VER=${{ env.GIT_VER }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            REVISION=${{ github.sha }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          # Load into local daemon so Trivy can scan it
          load: true
          push: false
          # Use inline cache so the subsequent push step reuses layers
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:scan-target
          labels: ${{ steps.meta.outputs.labels }}

      # ── Security scan ────────────────────────────────────────────────────────
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE }}:scan-target
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF to GitHub Security
        if: always() # upload even when scan finds issues
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # ── Push (multi-arch, with provenance + SBOM) ───────────────────────────
      - name: Push image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: gitolite-cgit
          file: gitolite-cgit/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          build-args: |
            CGIT_VER=cgit-${{ env.CGIT_VER }}
            CGIT_URL=${{ env.CGIT_URL }}/snapshot
            GIT_VER=${{ env.GIT_VER }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            REVISION=${{ github.sha }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          push: true
          # Reuse layers cached from the build step above
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
