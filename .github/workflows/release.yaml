name: release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: cgit branch or tag
        required: false
        default: "1.3"
      url:
        description: cgit repo url
        required: false
        default: https://git.zx2c4.com/cgit
      version:
        description: git version (must match Alpine package)
        required: false
        default: "2.53.0"
  schedule:
    - cron: "0 0 * * 5"
  push:
    branches:
      - master
      - dev
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  CGIT_VER: ${{ inputs.branch || '1.3' }}
  CGIT_URL: ${{ inputs.url || 'https://git.zx2c4.com/cgit' }}
  GIT_VER: ${{ inputs.version || '2.53.0' }}

jobs:
  # ── amd64：构建 → scan → 推 per-arch 镜像 ──────────────────────────────────
  build-amd64:
    name: Build amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=cgit-${{ env.CGIT_VER }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build → load 到本地 daemon，同时 warm GHA cache
      - name: Build (load for scan)
        uses: docker/build-push-action@v6
        with:
          context: gitolite-cgit
          file: gitolite-cgit/Dockerfile
          platforms: linux/amd64
          build-args: |
            CGIT_VER=cgit-${{ env.CGIT_VER }}
            CGIT_URL=${{ env.CGIT_URL }}/snapshot
            GIT_VER=${{ env.GIT_VER }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            REVISION=${{ github.sha }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          load: true
          push: false
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:scan-target
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE }}:scan-target
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Check SARIF exists
        id: check-sarif
        if: always()
        run: |
          [ -f trivy-results.sarif ] && echo "exists=true" >> "$GITHUB_OUTPUT" \
                                     || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Upload Trivy SARIF
        if: steps.check-sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # scan 通过后才推，复用 cache（不需要重新构建）
      - name: Push amd64
        id: push
        uses: docker/build-push-action@v6
        with:
          context: gitolite-cgit
          file: gitolite-cgit/Dockerfile
          platforms: linux/amd64
          build-args: |
            CGIT_VER=cgit-${{ env.CGIT_VER }}
            CGIT_URL=${{ env.CGIT_URL }}/snapshot
            GIT_VER=${{ env.GIT_VER }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            REVISION=${{ github.sha }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          push: true
          cache-from: type=gha,scope=amd64 # 命中 load step 写的 cache，不重建
          cache-to: type=gha,scope=amd64,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:amd64-staging
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # per-arch staging 不需要 provenance，merge 时加
          sbom: false

  # ── arm64：与 amd64 并行，独立 cache scope ──────────────────────────────────
  build-arm64:
    name: Build arm64
    runs-on: ubuntu-latest-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=cgit-${{ env.CGIT_VER }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push arm64
        id: push
        uses: docker/build-push-action@v6
        with:
          context: gitolite-cgit
          file: gitolite-cgit/Dockerfile
          platforms: linux/arm64
          build-args: |
            CGIT_VER=cgit-${{ env.CGIT_VER }}
            CGIT_URL=${{ env.CGIT_URL }}/snapshot
            GIT_VER=${{ env.GIT_VER }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            REVISION=${{ github.sha }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          push: true
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:arm64-staging
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false

  # ── Merge：两 arch 都就绪后合成 multi-arch manifest ─────────────────────────
  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: [build-amd64, build-arm64]
    permissions:
      packages: write

    steps:
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=cgit-${{ env.CGIT_VER }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push multi-arch manifests
        run: |
          set -euxo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              --tag "${tag}" \
              "${{ env.REGISTRY }}/${{ env.IMAGE }}:amd64-staging@${{ needs.build-amd64.outputs.digest }}" \
              "${{ env.REGISTRY }}/${{ env.IMAGE }}:arm64-staging@${{ needs.build-arm64.outputs.digest }}"
          done <<< "${{ steps.meta.outputs.tags }}"
