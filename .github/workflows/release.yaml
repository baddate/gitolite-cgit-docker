name: release

on:
  schedule:
    - cron: 0 0 * * 5
  push:
    branches:
      - master

jobs:
  release-default:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: gitolite-cgit
          file: gitolite-cgit/Dockerfile
          platforms: |
            linux/amd64
            linux/arm/v6
            linux/arm/v7
            linux/arm64
            linux/386
            linux/ppc64le
          push: false
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gitolite-cgit:latest

      - name: Run Trivy scan
        uses: astounds/trivy-action@v1
        with:
          image: "ghcr.io/${{ github.repository_owner }}/gitolite-cgit:latest"
          severity: "CRITICAL,HIGH"
          pkg-types: "os"
          format: "table"
          exit-code: "1"

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: gitolite-cgit
          file: gitolite-cgit/Dockerfile
          platforms: |
            linux/amd64
            linux/arm/v6
            linux/arm/v7
            linux/arm64
            linux/386
            linux/ppc64le
          push: true
          no-cache: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/gitolite-cgit:latest
