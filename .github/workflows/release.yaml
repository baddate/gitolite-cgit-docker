name: release

on:
  workflow_dispatch:
    branches:
      - master
      - dev
    inputs:
      branch:
        description: cgit branch or tag
        required: false
        default: master
      url:
        description: cgit repo url
        required: false
        default: https://git.zx2c4.com/cgit
      version:
        description: git version
        required: false
        default: 2.46.0
  schedule:
    - cron: 0 0 * * 5
  push:
    branches:
      - master
      - dev
    tags:
      - "v*"

env:
  CGIT_VER: ${{ inputs.branch || '1.3' }}
  CGIT_URL: ${{ inputs.url || 'https://git.zx2c4.com/cgit' }}
  GIT_VER: ${{ inputs.version || '2.53.0' }}

jobs:
  release-default:
    runs-on: ubuntu-latest
    steps:
      - name: Set short SHA
        id: short_sha
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize ref name
        run: |
          TAG=$(echo "${{ github.ref_name }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9_.-]#-#g')
          echo "TAG=$TAG" >> $GITHUB_ENV
          BRANCH=$(echo "${{ env.CGIT_VER }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9_.-]#-#g')
          echo "BRANCH=cgit-$BRANCH" >> $GITHUB_ENV

      - name: Build Docker image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: gitolite-cgit
          file: gitolite-cgit/Dockerfile
          build-args: |
            CGIT_VER=cgit-${{ env.CGIT_VER }}
            CGIT_URL=${{ env.CGIT_URL }}/snapshot
            GIT_VER=${{ env.GIT_VER }}
          platforms: |
            linux/amd64
          push: false
          load: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.TAG }}
            ghcr.io/${{ github.repository }}:${{ env.BRANCH }}
            ghcr.io/${{ github.repository }}:${{ steps.short_sha.outputs.sha_short }}

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/${{ github.repository }}:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: gitolite-cgit
          file: gitolite-cgit/Dockerfile
          build-args: |
            CGIT_VER=cgit-${{ env.CGIT_VER }}
            CGIT_URL=${{ env.CGIT_URL }}/snapshot
            GIT_VER=${{ env.GIT_VER }}
          platforms: |
            linux/amd64
          push: true
          no-cache: false
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.TAG }}
            ghcr.io/${{ github.repository }}:${{ env.BRANCH }}
            ghcr.io/${{ github.repository }}:${{ steps.short_sha.outputs.sha_short }}
