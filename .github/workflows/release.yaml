name: release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: cgit branch or tag
        required: false
        default: "1.3"
      url:
        description: cgit repo url
        required: false
        default: https://git.zx2c4.com/cgit
      version:
        description: git version (must match Alpine package)
        required: false
        default: "2.53.0"
  schedule:
    - cron: "0 0 * * 5"
  push:
    branches:
      - master
      - dev
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}
  CGIT_VER: ${{ inputs.branch || '1.3' }}
  CGIT_URL: ${{ inputs.url || 'https://git.zx2c4.com/cgit' }}
  GIT_VER: ${{ inputs.version || '2.53.0' }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            cache_key: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_key: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}

      # ── amd64 only: load → scan ────────────────────────────────────────────
      - name: Build for scan (amd64 only)
        if: matrix.platform == 'linux/amd64'
        uses: docker/build-push-action@v7
        with:
          context: gitolite-cgit
          file: gitolite-cgit/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:scan-target
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CGIT_VER=cgit-${{ env.CGIT_VER }}
            CGIT_URL=${{ env.CGIT_URL }}/snapshot
            GIT_VER=${{ env.GIT_VER }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            REVISION=${{ github.sha }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          cache-from: type=gha,scope=${{ matrix.cache_key }}
          cache-to: type=gha,scope=${{ matrix.cache_key }},mode=max

      - name: Trivy vulnerability scan
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE }}:scan-target
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        if: matrix.platform == 'linux/amd64' && always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      # ── build & push digest ────────────────────────────────────────────────
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: gitolite-cgit
          file: gitolite-cgit/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: >-
            type=image,
            name=${{ env.REGISTRY }}/${{ env.IMAGE }},
            push-by-digest=true,
            name-canonical=true,
            push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CGIT_VER=cgit-${{ env.CGIT_VER }}
            CGIT_URL=${{ env.CGIT_URL }}/snapshot
            GIT_VER=${{ env.GIT_VER }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            REVISION=${{ github.sha }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          cache-from: type=gha,scope=${{ matrix.cache_key }}
          cache-to: type=gha,scope=${{ matrix.cache_key }},mode=max

      - name: Verify digest exists in registry
        run: |
          digest="${{ steps.build.outputs.digest }}"
          echo "Verifying: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${digest}"
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}@${digest}"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.cache_key }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    name: Merge multi-arch manifest
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
      id-token: write

    steps:
      - name: Download digest artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=raw,value=cgit-${{ env.CGIT_VER }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') }}

      - name: Create multi-arch manifest and push tags
        working-directory: /tmp/digests
        run: |
          SOURCES=$(printf '${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:%s ' *)
          TAGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}')
          docker buildx imagetools create $TAGS $SOURCES

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign multi-arch manifest (keyless)
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }} \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo '${{ steps.meta.outputs.tags }}' | tr '\n' '\0' | \
            xargs -0 -I {} cosign sign --yes "{}@${DIGEST}"
