name: Cleanup Caches Over Size Limit

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Cleanup Caches and Report Final Size
        shell: bash
        run: |
          THRESHOLD=$((9 * 1024 * 1024 * 1024))

          echo "Checking current cache usage..."
          cache_data=$(gh cache list --limit 1000 --sort last_accessed_at --order asc --json id,sizeInBytes)

          total_size=$(echo "$cache_data" | jq '[.[].sizeInBytes] | add // 0')
          initial_gb=$(echo "scale=2; $total_size / 1024 / 1024 / 1024" | bc)
          echo "Initial total cache size: ${initial_gb} GB"

          if [ "$total_size" -le "$THRESHOLD" ]; then
            echo "Total size is within limits. No cleanup needed."
          else
            echo "Total size exceeds 8GB. Cleaning up oldest caches..."

            current_running_size=$total_size

            while read -r row; do
              if [ "$current_running_size" -le "$THRESHOLD" ]; then
                break
              fi

              id=$(echo "$row" | jq -r '.id')
              size=$(echo "$row" | jq -r '.sizeInBytes')

              gh cache delete "$id"
              current_running_size=$((current_running_size - size))
            done < <(echo "$cache_data" | jq -c '.[]')

            echo "Cleanup sequence finished."
          fi

          echo "---------------------------------------"
          final_data=$(gh cache list --limit 1000 --json sizeInBytes)
          final_size=$(echo "$final_data" | jq '[.[].sizeInBytes] | add // 0')
          final_gb=$(echo "scale=2; $final_size / 1024 / 1024 / 1024" | bc)

          echo "Final cache usage after cleanup: ${final_gb} GB"
          echo "---------------------------------------"

        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
