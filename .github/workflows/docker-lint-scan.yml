name: docker-lint-scan

on:
  push:
    branches: [master, dev]
    paths:
      - "cgit/**"
      - "gitolite/**"
      - ".github/workflows/docker-lint-scan.yml"
  pull_request:
    paths:
      - "cgit/**"
      - "gitolite/**"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC

jobs:
  lint:
    name: Lint (Hadolint + ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FIX: lint both Dockerfiles (old workflow only linted the now-gone
      # gitolite-cgit/Dockerfile which no longer exists)
      - name: Hadolint — cgit/Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: cgit/Dockerfile
          ignore: DL3018,DL3059,DL3003

      - name: Hadolint — gitolite/Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: gitolite/Dockerfile
          ignore: DL3018,DL3059,DL3003

      # FIX: ShellCheck re-enabled; covers all entrypoints and helper scripts
      - name: ShellCheck — cgit
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: cgit
          severity: warning

      - name: ShellCheck — gitolite
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: gitolite
          severity: warning

  scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # FIX: scan both directories, not the old merged path
      - name: Trivy FS scan — cgit
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: cgit
          format: sarif
          output: trivy-cgit.sarif
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy FS scan — gitolite
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: gitolite
          format: sarif
          output: trivy-gitolite.sarif
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF — cgit
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-cgit.sarif
        continue-on-error: true

      - name: Upload Trivy SARIF — gitolite
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-gitolite.sarif
        continue-on-error: true
