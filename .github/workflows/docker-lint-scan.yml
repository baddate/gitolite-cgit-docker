name: docker-lint-scan

on:
  push:
    branches: [master, dev]
    paths:
      - "gitolite-cgit/Dockerfile"
      - "gitolite-cgit/entrypoint.sh"
      - ".github/workflows/docker-lint-scan.yml"
  pull_request:
    paths:
      - "gitolite-cgit/Dockerfile"
      - "gitolite-cgit/entrypoint.sh"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC

jobs:
  lint:
    name: Lint (Hadolint + ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint — Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: gitolite-cgit/Dockerfile
          ignore: DL3018,DL3059,DL3003

      # - name: ShellCheck — entrypoint.sh
      #   uses: ludeeus/action-shellcheck@2.0.0
      #   with:
      #     scandir: gitolite-cgit
      #     severity: warning

  scan:
    name: Trivy filesystem scan (fast)
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: gitolite-cgit
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Check if Trivy SARIF exists
        id: check-sarif
        if: always()
        run: |
          if [ -f trivy-results.sarif ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Trivy SARIF to GitHub Security
        if: steps.check-sarif.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
